<svg xmlns="http://www.w3.org/2000/svg" width="240" height="380" viewBox="0 0 240 380">
  <!-- Background art: no "components" group, so the Mixer keeps its
       automatic layout and labels, and this is stretched behind them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3a40"/>
      <stop offset="1" stop-color="#071a1f"/>
    </linearGradient>
    <pattern id="lines" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="240" height="380" fill="url(#bg)"/>
  <rect width="240" height="380" fill="url(#lines)"/>
  <rect width="240" height="5" fill="#3ad0b8"/>
  <rect y="5" width="240" height="1.5" fill="#3ad0b8" fill-opacity="0.35"/>
</svg>
