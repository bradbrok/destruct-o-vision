name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only builds and tests.
permissions:
  contents: read

jobs:
  check:
    # macOS only for now: Linux and Windows builds haven't been tried yet.
    runs-on: macos-15
    steps:
      # Actions are pinned to commits; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-toolchain.toml selects the toolchain and its components.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
