[package]
name = "dov-io"
description = "Video and control I/O: cameras, movie files, audio input and MIDI (and later Syphon, NDI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cpal = "0.18.2"
log.workspace = true
midir = "0.11.1"
rusty_link = "0.4.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
objc2-core-foundation = "0.3"
libc.workspace = true

[dev-dependencies]
env_logger.workspace = true
png.workspace = true
